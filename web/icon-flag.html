<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旗子跑者 · 图标方案</title>
<style>
:root{
  --font:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  --bg:#0B0C0E;--surface:#16181C;--line:#2B2E35;--text:#F4F5F6;--muted:#A1A5AD;--faint:#6E737C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:22px 18px 44px;-webkit-font-smoothing:antialiased}
h1{font-size:18px;font-weight:700;margin:0 0 6px}
.sub{font-size:12px;color:var(--faint);margin:0 0 20px;line-height:1.6}
.big{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px;
}
.big .holder{width:200px;height:200px;border-radius:46px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.big .holder svg{width:100%;height:100%;display:block}
.big .cap{font-size:13px;font-weight:600}
.big .capd{font-size:11px;color:var(--faint);text-align:center;line-height:1.5;margin-top:-8px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.iw{width:104px;height:104px;border-radius:24px;overflow:hidden;background:#fff}
.iw svg{width:100%;height:100%;display:block}
.iw.round{border-radius:50%}
.name{font-size:12px;font-weight:600;text-align:center}
.desc{font-size:10px;color:var(--faint);text-align:center;line-height:1.45;margin-top:-4px}

.sizes{display:flex;align-items:flex-end;gap:16px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sz{display:flex;flex-direction:column;align-items:center;gap:6px}
.sz .box{background:#fff;overflow:hidden}
.sz .box svg{width:100%;height:100%;display:block}
.sz span{font-size:10px;color:var(--faint)}
</style>
</head>
<body>

<h1>旗子 + 力字跑者</h1>
<p class="sub">白底 · 黑白格旗 · 黑色小人（造型取「力」字的撇和横折钩）</p>

<!-- 主方案 -->
<div class="big">
  <div class="holder">
    <svg viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#FFFFFF"/>
      <!-- 旗杆 -->
      <rect x="34" y="26" width="6" height="76" rx="3" fill="#0B0C0E"/>
      <!-- 格子旗 -->
      <g>
        <rect x="40" y="26" width="72" height="48" rx="3" fill="#FFFFFF" stroke="#0B0C0E" stroke-width="3"/>
        <g fill="#0B0C0E">
          <rect x="40" y="26" width="18" height="12"/>
          <rect x="76" y="26" width="18" height="12"/>
          <rect x="58" y="38" width="18" height="12"/>
          <rect x="94" y="38" width="18" height="12"/>
          <rect x="40" y="50" width="18" height="12"/>
          <rect x="76" y="50" width="18" height="12"/>
          <rect x="58" y="62" width="18" height="12"/>
          <rect x="94" y="62" width="18" height="12"/>
        </g>
        <rect x="40" y="26" width="72" height="48" rx="3" fill="none" stroke="#0B0C0E" stroke-width="3.5"/>
      </g>

      <!-- 「力」字跑者 -->
      <g fill="none" stroke="#0B0C0E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <!-- 力的横折钩：一横 → 折下 → 钩 -->
        <path d="M60 110 L112 110 L112 158 L124 148"/>
        <!-- 力的撇：从横折交界处向左下甩出 -->
        <path d="M100 110 L64 178"/>
      </g>
      <!-- 手臂：一前一后，细一点 -->
      <g fill="none" stroke="#0B0C0E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M82 110 L58 138"/>
        <path d="M104 110 L126 130"/>
      </g>
      <!-- 头部 -->
      <circle cx="76" cy="86" r="11.5" fill="#0B0C0E"/>
    </svg>
  </div>
  <div class="cap">主方案</div>
  <div class="capd">旗子在左上，小人在下方奔跑<br>身体是「力」字的横折钩，一撇是后蹬腿</div>
</div>

<h1 style="font-size:15px;margin-bottom:14px">变体</h1>

<div class="grid">

  <!-- 变体1：旗子小一点，小人更突出 -->
  <div class="card">
    <div class="iw">
      <svg viewBox="0 0 120 120">
        <rect width="120" height="120" fill="#FFFFFF"/>
        <rect x="20" y="16" width="5" height="88" rx="2.5" fill="#0B0C0E"/>
        <g>
          <rect x="25" y="16" width="52" height="36" rx="3" fill="#FFFFFF" stroke="#0B0C0E" stroke-width="2.6"/>
          <g fill="#0B0C0E">
            <rect x="25" y="16" width="13" height="9"/>
            <rect x="51" y="16" width="13" height="9"/>
            <rect x="38" y="25" width="13" height="9"/>
            <rect x="64" y="25" width="13" height="9"/>
            <rect x="25" y="34" width="13" height="9"/>
            <rect x="51" y="34" width="13" height="9"/>
            <rect x="38" y="43" width="13" height="9"/>
            <rect x="64" y="43" width="13" height="9"/>
          </g>
          <rect x="25" y="16" width="52" height="36" rx="3" fill="none" stroke="#0B0C0E" stroke-width="2.8"/>
        </g>
        <g fill="none" stroke="#0B0C0E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M44 64 L76 64 L76 100"/>
          <path d="M70 70 L54 108"/>
          <path d="M58 64 L44 82"/>
          <path d="M68 64 L86 78"/>
        </g>
        <circle cx="56" cy="48" r="8.5" fill="#0B0C0E"/>
      </svg>
    </div>
    <div class="name">1 · 旗小人大</div>
    <div class="desc">小人占主体，旗子点缀</div>
  </div>

  <!-- 变体2：圆角方块，旗杆穿过 -->
  <div class="card">
    <div class="iw">

        <rect width="120" height="120" fill="#FFFFFF"/>
        <rect x="26" y="20" width="6" height="80" rx="3" fill="#0B0C0E"/>
        <g>
          <rect x="32" y="20" width="46" height="32" rx="3" fill="#FFFFFF" stroke="#0B0C0E" stroke-width="2.6"/>
          <g fill="#0B0C0E">
            <rect x="32" y="20" width="11.5" height="8"/>
            <rect x="55" y="20" width="11.5" height="8"/>
            <rect x="43.5" y="28" width="11.5" height="8"/>
            <rect x="66.5" y="28" width="11.5" height="8"/>
            <rect x="32" y="36" width="11.5" height="8"/>
            <rect x="55" y="36" width="11.5" height="8"/>
            <rect x="43.5" y="44" width="11.5" height="8"/>
            <rect x="66.5" y="44" width="11.5" height="8"/>
          </g>
          <rect x="32" y="20" width="46" height="32" rx="3" fill="none" stroke="#0B0C0E" stroke-width="2.8"/>
        </g>
        <g fill="none" stroke="#0B0C0E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 64 L82 64 L82 100"/>
          <path d="M76 70 L60 108"/>
          <path d="M64 64 L50 82"/>
          <path d="M74 64 L92 78"/>
        </g>
        <circle cx="62" cy="48" r="8.5" fill="#0B0C0E"/>
      </svg>
    </div>
    <div class="name">2 · 居中构图</div>
    <div class="desc">左右更平衡</div>
  </div>

  <!-- 变体3：圆形底 -->
  <div class="card">
    <div class="iw round">
      <svg viewBox="0 0 120 120">
        <rect width="120" height="120" fill="#FFFFFF"/>
        <rect x="22" y="18" width="5" height="84" rx="2.5" fill="#0B0C0E"/>
        <g>
          <rect x="27" y="18" width="50" height="34" rx="3" fill="#FFFFFF" stroke="#0B0C0E" stroke-width="2.6"/>
          <g fill="#0B0C0E">
            <rect x="27" y="18" width="12.5" height="8.5"/>
            <rect x="52" y="18" width="12.5" height="8.5"/>
            <rect x="39.5" y="26.5" width="12.5" height="8.5"/>
            <rect x="64.5" y="26.5" width="12.5" height="8.5"/>
            <rect x="27" y="35" width="12.5" height="8.5"/>
            <rect x="52" y="35" width="12.5" height="8.5"/>
            <rect x="39.5" y="43.5" width="12.5" height="8.5"/>
            <rect x="64.5" y="43.5" width="12.5" height="8.5"/>
          </g>
          <rect x="27" y="18" width="50" height="34" rx="3" fill="none" stroke="#0B0C0E" stroke-width="2.8"/>
        </g>
        <g fill="none" stroke="#0B0C0E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M46 62 L78 62 L78 98"/>
          <path d="M72 68 L56 106"/>
          <path d="M60 62 L46 80"/>
          <path d="M70 62 L88 76"/>
        </g>
        <circle cx="58" cy="46" r="8.5" fill="#0B0C0E"/>
      </svg>
    </div>
    <div class="name">3 · 圆形图标</div>
    <div class="desc">圆形裁切时的样子</div>
  </div>

  <!-- 变体4：加一点橙 -->
  <div class="card">
    <div class="iw">
      <svg viewBox="0 0 120 120">
        <rect width="120" height="120" fill="#FFFFFF"/>
        <rect x="22" y="18" width="5" height="84" rx="2.5" fill="#0B0C0E"/>
        <g>
          <rect x="27" y="18" width="50" height="34" rx="3" fill="#FFFFFF" stroke="#0B0C0E" stroke-width="2.6"/>
          <g fill="#0B0C0E">
            <rect x="27" y="18" width="12.5" height="8.5"/>
            <rect x="52" y="18" width="12.5" height="8.5"/>
            <rect x="39.5" y="26.5" width="12.5" height="8.5"/>
            <rect x="64.5" y="26.5" width="12.5" height="8.5"/>
            <rect x="27" y="35" width="12.5" height="8.5"/>
            <rect x="52" y="35" width="12.5" height="8.5"/>
            <rect x="39.5" y="43.5" width="12.5" height="8.5"/>
            <rect x="64.5" y="43.5" width="12.5" height="8.5"/>
          </g>
          <rect x="27" y="18" width="50" height="34" rx="3" fill="none" stroke="#0B0C0E" stroke-width="2.8"/>
        </g>
        <g fill="none" stroke="#0B0C0E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M46 62 L78 62 L78 98"/>
          <path d="M72 68 L56 106"/>
          <path d="M60 62 L46 80"/>
          <path d="M70 62 L88 76"/>
        </g>
        <circle cx="58" cy="46" r="8.5" fill="#FF5A1F"/>
      </svg>
    </div>
    <div class="name">4 · 橙色点头</div>
    <div class="desc">头部用品牌橙，呼应 App 配色</div>
  </div>

</div>
